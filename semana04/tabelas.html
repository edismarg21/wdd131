<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela HTML</title>
    <link rel="stylesheet" href="estilos.css">

</head>
<body>
    <main>
        <h1>Pratica com Tabela HTML</h1>

        <!--=========================================
            Início da tabela
            ==========================================-->
        <table>
            <caption>Tabela 1: Comparação de Recursos da Conta</caption>

            <thead>
                <tr>
                <th scope="col">Recurso</th>
                <th scope="col">Básico</th>
                <th scope="col">Premium</th>
                </tr>
            </thead>
            
            <tbody>
                <!---corpoda tabela.Onde ficam os dados das colunas-->

                <!-----------linha 1----------->
                <tr>

                    <td>Armazenamento</td>
                    <td>5 GB</td>
                    <td>100 GB</td>
                </tr>

                <!------------linha 2------------>
                <tr>
                    <td>Suporte</td>
                    <td>❌</td>
                    <td>✔️</td>
                </tr>

                <!------------linha 3------------>

                <tr>
                    <td>Relatórios</td>
                    <td>❌</td>
                    <td>✔️</td>
                </tr>

                <tr>
                    <td>Backup</td>
                    <td>Diário</td>
                    <td>Em tempo real</td>
                </tr>
            </tbody>
        
        </table>
          <!--Fin da tabela -->

    </main>
    
</body>
</html>
